spring.application.name=shareshelf

spring.datasource.url=jdbc:mysql://localhost:3306/shareshelf_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.5-flash-lite

jwt.access-cookie-name=SHARE_SHELF_ACCESS
jwt.refresh-cookie-name=SHARE_SHELF_REFRESH
app.security.cookie-secure=false


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.upload.directory=uploads
