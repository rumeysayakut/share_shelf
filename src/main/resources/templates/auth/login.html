
<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | ShareShelf</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <a class="brand" th:href="@{/books}">Share<span>Shelf</span></a>
            <div class="book-icon">📚</div>
            <h1>Tekrar hoş geldin!</h1>
            <p class="subtitle">Kitapların paylaşıldığı güzel bir topluluğa katıl.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-posta adresi</label>
                    <input type="email" id="email" name="email" placeholder="ornek@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>
                </div>

                <p id="errorMessage" class="error-message"></p>

                <button type="submit" class="auth-button" id="loginButton">Giriş Yap</button>
            </form>

            <p class="auth-footer">
                Henüz hesabın yok mu?
                <a th:href="@{/register}">Hemen kayıt ol</a>
            </p>

            <a class="back-link" th:href="@{/books}">Kitaplara göz at</a>
        </section>
    </main>
</body>
</html>
